services:
  syncy:
    build:
      context: .
      dockerfile: Dockerfile
    image: syncy:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
    ports:
      - "${SYNCY_PORT:-8080}:8080"
    volumes:
      - syncy-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  syncy-data:
    name: syncy-data
